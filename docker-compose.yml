services:
  ollama:
    image: ollama/ollama:latest
    container_name: maestro_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - maestro_network

networks:
  maestro_network:
    driver: bridge

volumes:
  ollama_models:
    driver: local
