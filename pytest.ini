[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --asyncio-mode=auto
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (require Docker Ollama)
    slow: Slow tests (LLM calls)
asyncio_mode = auto
